name: Build Amanati APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project ZIP
        run: unzip -q AmanatiAndroid_project.zip -d extracted

      - name: Build debug APK
        run: | cd extracted/AmanatiAndroid gradle assembleDebug 
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amanati-debug-APK
          path: extracted/AmanatiAndroid/app/build/outputs/apk/debug/app-debug.apk
